<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MU-MU GRILL — Nueva orden</title>
<style>
  :root {
    --bg: #1c1b1a;
    --panel: #262523;
    --panel-line: #3a3835;
    --text: #f2efea;
    --text-dim: #a8a39c;
    --accent: #e3a008;
    --accent-text: #1c1b1a;
    --danger: #c1440e;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .mono { font-family: "SF Mono", "Courier New", monospace; }

  header {
    padding: 20px 18px 14px;
    border-bottom: 1px solid var(--panel-line);
  }
  header h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: 0.2px;
  }
  header p {
    margin: 4px 0 0;
    color: var(--text-dim);
    font-size: 13px;
  }

  main {
    padding: 16px 16px 120px;
    max-width: 480px;
    margin: 0 auto;
  }

  section {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 14px;
  }
  section h2 {
    margin: 0 0 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
  }

  .toggle-row {
    display: flex;
    gap: 8px;
  }
  .toggle {
    flex: 1;
    text-align: center;
    padding: 12px 0;
    border-radius: var(--radius);
    border: 1px solid var(--panel-line);
    background: transparent;
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .toggle.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }

  label.field-label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin: 12px 0 6px;
  }
  label.field-label:first-child { margin-top: 0; }

  input[type=text], input[type=tel], input[type=number], textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--panel-line);
    border-radius: var(--radius);
    padding: 11px 12px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 44px; }
  input::placeholder, textarea::placeholder { color: #6b6763; }

  .item-card {
    border: 1px solid var(--panel-line);
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 10px;
    position: relative;
  }
  .item-card .remove-item {
    position: absolute;
    top: 8px;
    right: 8px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    line-height: 1;
    padding: 4px;
    cursor: pointer;
  }
  .qty-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .qty-row input[type=number] { width: 70px; text-align: center; }

  button.add-item {
    width: 100%;
    padding: 11px 0;
    border-radius: var(--radius);
    border: 1px dashed var(--panel-line);
    background: transparent;
    color: var(--text-dim);
    font-size: 14px;
    cursor: pointer;
  }

  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .total-row input {
    text-align: right;
    font-size: 20px;
    width: 120px;
  }

  footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 70%, transparent);
  }
  footer .inner { max-width: 480px; margin: 0 auto; }
  button.submit {
    width: 100%;
    padding: 16px 0;
    border-radius: var(--radius);
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  button.submit:disabled { opacity: 0.5; }

  #status {
    margin-top: 10px;
    font-size: 14px;
    text-align: center;
  }
  #status.ok { color: #7fbf6a; }
  #status.err { color: var(--danger); }
</style>
</head>
<body>

<header>
  <h1>MU-MU GRILL</h1>
  <p>Nueva orden manual — se imprime directamente en cocina</p>
</header>

<main>
  <section>
    <h2>TIPO DE ENTREGA</h2>
    <div class="toggle-row" id="serviceTypeToggle">
      <button type="button" class="toggle active" data-value="delivery">A domicilio</button>
      <button type="button" class="toggle" data-value="pickup">Recogida</button>
    </div>
  </section>

  <section>
    <h2>CLIENTE</h2>
    <label class="field-label">Nombre</label>
    <input type="text" id="customerName" placeholder="Juan Pérez">
    <label class="field-label">Teléfono</label>
    <input type="tel" id="customerPhone" placeholder="600 000 000">
    <label class="field-label" id="addressLabel">Dirección</label>
    <textarea id="deliveryAddress" placeholder="Calle, número, piso..."></textarea>
    <label class="field-label">Nota (opcional)</label>
    <input type="text" id="deliveryNotes" placeholder="Timbre roto, llamar al llegar...">
  </section>

  <section>
    <h2>PEDIDO</h2>
    <div id="itemsContainer"></div>
    <button type="button" class="add-item" id="addItemBtn">+ Añadir producto</button>
  </section>

  <section>
    <h2>PAGO</h2>
    <div class="toggle-row" id="paymentToggle">
      <button type="button" class="toggle active" data-value="cash">Efectivo</button>
      <button type="button" class="toggle" data-value="card">Tarjeta</button>
    </div>
    <label class="field-label">Total</label>
    <div class="total-row">
      <span class="mono" style="color: var(--text-dim);">EUR</span>
      <input type="number" id="total" class="mono" step="0.5" placeholder="0.00">
    </div>
  </section>
</main>

<footer>
  <div class="inner">
    <button class="submit" id="submitBtn">Enviar a cocina</button>
    <div id="status"></div>
  </div>
</footer>

<script>
// --- CONFIGURACIÓN (ajustar antes de usar) ---
const SERVER_URL = 'https://mumu-server-production.up.railway.app';
const TOKEN = '3040e0ad611144e1d47517362ccb6d2b60b96f5b71564aef';
// ----------------------------------------------

let itemIdCounter = 0;

function addItemRow(prefill) {
  itemIdCounter += 1;
  const id = itemIdCounter;
  const container = document.getElementById('itemsContainer');
  const card = document.createElement('div');
  card.className = 'item-card';
  card.dataset.id = id;
  card.innerHTML = `
    <button type="button" class="remove-item" aria-label="Eliminar">×</button>
    <label class="field-label">Producto</label>
    <input type="text" class="item-name" placeholder="Cosa Nostra">
    <div class="qty-row">
      <div style="flex:1;">
        <label class="field-label">Cantidad</label>
        <input type="number" class="item-qty" value="1" min="1">
      </div>
    </div>
    <label class="field-label">Modificaciones (separadas por coma)</label>
    <input type="text" class="item-mods" placeholder="Sin cebolla, poco hecha">
    <label class="field-label">Extras (separados por coma)</label>
    <input type="text" class="item-extras" placeholder="Cheddar, bacon">
  `;
  container.appendChild(card);
  card.querySelector('.remove-item').addEventListener('click', () => {
    card.remove();
  });
}

document.getElementById('addItemBtn').addEventListener('click', () => addItemRow());
addItemRow(); // start with one empty item row

function setupToggle(containerId, onChange) {
  const el = document.getElementById(containerId);
  el.querySelectorAll('.toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      el.querySelectorAll('.toggle').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      onChange(btn.dataset.value);
    });
  });
}

let serviceType = 'delivery';
let paymentMethod = 'cash';

setupToggle('serviceTypeToggle', (val) => {
  serviceType = val;
  const addressField = document.getElementById('deliveryAddress');
  const addressLabel = document.getElementById('addressLabel');
  if (val === 'pickup') {
    addressLabel.textContent = 'Dirección (no necesaria para recogida)';
    addressField.placeholder = '';
  } else {
    addressLabel.textContent = 'Dirección';
    addressField.placeholder = 'Calle, número, piso...';
  }
});

setupToggle('paymentToggle', (val) => { paymentMethod = val; });

function splitCommaList(str) {
  return (str || '')
    .split(',')
    .map(s => s.trim())
    .filter(Boolean);
}

document.getElementById('submitBtn').addEventListener('click', async () => {
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');

  const itemCards = document.querySelectorAll('.item-card');
  const items = Array.from(itemCards).map(card => ({
    name: card.querySelector('.item-name').value.trim(),
    quantity: Number(card.querySelector('.item-qty').value) || 1,
    modifications: splitCommaList(card.querySelector('.item-mods').value),
    extras: splitCommaList(card.querySelector('.item-extras').value),
  })).filter(item => item.name);

  if (items.length === 0) {
    statusEl.textContent = 'Añade al menos un producto con nombre.';
    statusEl.className = 'err';
    return;
  }

  const order = {
    service_type: serviceType,
    payment_method: paymentMethod,
    total: Number(document.getElementById('total').value) || 0,
    customer_name: document.getElementById('customerName').value.trim() || null,
    customer_phone: document.getElementById('customerPhone').value.trim() || null,
    delivery_address: document.getElementById('deliveryAddress').value.trim() || null,
    delivery_notes: document.getElementById('deliveryNotes').value.trim() || null,
    items,
  };

  submitBtn.disabled = true;
  statusEl.textContent = 'Enviando...';
  statusEl.className = '';

  try {
    const res = await fetch(`${SERVER_URL}/manual-order?token=${encodeURIComponent(TOKEN)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(order),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    statusEl.textContent = '✓ Pedido enviado a cocina.';
    statusEl.className = 'ok';
  } catch (err) {
    statusEl.textContent = 'Error al enviar: ' + err.message;
    statusEl.className = 'err';
  } finally {
    submitBtn.disabled = false;
  }
});
</script>

</body>
</html>
